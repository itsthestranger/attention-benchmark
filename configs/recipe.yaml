# Training recipe, one for every run (plan §7).
# FROZEN (plan §17.3): changes only through a pull request that Phil approves.
# Three values are deliberately unset. Phil sets them from the smoke runs of
# all seven variants, before the recipe freeze (plan §7.3, decision 29).
# The peak learning rate is not here: it comes from the sweeps (plan §7.4) and
# is given per run.

optimizer:
  name: adamw
  betas: [0.9, 0.95]
  eps: 1.0e-8
  # On 2D weight matrices only; none on norm gains or the tied embedding.
  weight_decay: 0.1
  grad_clip_norm: 1.0

batch:
  sequences_per_step: 64
  sequence_length: 1024
  tokens_per_step: 65536
  # UNSET. Largest that fits the MLA naive path in `ref` mode on a T4;
  # identical for all variants, gradient accumulation makes up the rest.
  micro_batch: null

dropout: 0.0

schedule:
  name: wsd
  warmup_steps: 100        # linear, identical for every budget
  decay_fraction: 0.2      # the last 20% of the budget's steps, to zero
  decay_shape: one_minus_sqrt
  final_lr: 0.0

# Budgets are defined in optimizer steps (plan §7.1).
budgets:
  50M: 763
  100M: 1526
  200M: 3052
  300M: 4578

grad_scaler:
  # UNSET. Set once, globally: at most 3 skipped steps in the first 100, for
  # every variant. Never tuned per variant.
  init_scale: null
  growth_interval: null
